services:
  muster:
    build: .
    image: muster:latest
    ports:
      - "8080:8080"
    environment:
      # Demo mode creates four test accounts and sample incidents on first start.
      # Set it to "false" for real use, and set ADMIN_PASSWORD (or read the generated one in the logs).
      DEMO_MODE: "true"
      # ADMIN_PASSWORD: "change-me-please"
      # Set to "true" when Muster is served over HTTPS (behind a reverse proxy).
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
    volumes:
      - muster-data:/data
    restart: unless-stopped

volumes:
  muster-data:
