<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Muster</title>
<style>
  /* Two faces only: one display, one UI. Point these at the brand's files in fonts/. */
  @font-face { font-family: Display; src: url(assets/fonts/InstrumentSans-Regular.ttf) format('truetype'); font-weight: 100 549; }
  @font-face { font-family: Display; src: url(assets/fonts/InstrumentSans-Bold.ttf) format('truetype'); font-weight: 550 900; }
  @font-face { font-family: UI; src: url(assets/fonts/GeistMono-Regular.ttf) format('truetype'); font-weight: 100 549; }
  @font-face { font-family: UI; src: url(assets/fonts/GeistMono-Bold.ttf) format('truetype'); font-weight: 550 900; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub · ?format=9x16 to preview other formats</div>
<script type="module" src="film.js"></script>
</body>
</html>
