# Publishes ghcr.io/solidgeeks/muster:<version> and :latest, with a signed build provenance
# attestation, and a GitHub release, on every vX.Y.Z tag.
# Verify an image: gh attestation verify oci://ghcr.io/solidgeeks/muster:<version> --owner SolidGeeks
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  # Sigstore keyless signing: the workflow's OIDC identity stands in for a signing key
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tests
        run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: true
          tags: |
            ghcr.io/solidgeeks/muster:${{ steps.version.outputs.version }}
            ghcr.io/solidgeeks/muster:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SolidGeeks/muster
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      # Signs the image digest (not the tag, which can be moved) and stores the attestation
      # on GitHub and next to the image in ghcr.io
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/solidgeeks/muster
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Muster $GITHUB_REF_NAME" --notes-file <(awk '/^## \[/{n++} n==1' CHANGELOG.md) --verify-tag
