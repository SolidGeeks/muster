name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # A pull request must include the latest release of its base branch. One made from an old main undoes what
  # was fixed since, and conflicts. Lagging a few commits behind is fine: it only gets a notice.
  base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the branch as pushed, not the merge GitHub prepares (that one always contains the base branch)
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: The branch includes the latest release
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --quiet origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" '+refs/tags/*:refs/tags/*'
          behind=$(git rev-list --count HEAD..origin/$BASE)
          tag=$(git tag --merged origin/$BASE --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -n "$tag" ] && ! git merge-base --is-ancestor "$tag" HEAD; then
            echo "::error::This branch starts before $tag: it is $behind commits behind $BASE. Update it from $BASE (git fetch upstream && git rebase upstream/$BASE, or git merge upstream/$BASE), then push again."
            exit 1
          fi
          if [ "$behind" -gt 0 ]; then echo "::notice::This branch includes $tag but is $behind commits behind $BASE."; else echo "Up to date with $BASE."; fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The browser walk-through: the only test of the web interface, so updates of esbuild, React or TypeScript
  # are checked in a real browser, not only through the API.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screens
          path: tests/screens

  # Builds the Docker image as the Release workflow does (without publishing it), starts it and checks its health:
  # a dependency or action update that breaks the image fails here, not at release time.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: muster:ci
      - name: Start the image and check its health
        run: |
          docker run -d --name muster -p 8080:8080 -e DEMO_MODE=true muster:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          echo "/ -> $code"; test "$code" = 200
      - if: failure()
        run: docker logs muster
